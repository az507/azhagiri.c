apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-app
  labels:
    part-of: agile-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale-app
  template:
    metadata:
      labels:
        app: scale-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
