apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  labels:
    part-of: agile-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-web
  template:
    metadata:
      labels:
        app: lab-web
    spec:
      containers:
        - name: web
          image: pugazhmsp/lab-web-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web-svc
  labels:
    part-of: agile-lab
spec:
  type: NodePort
  selector:
    app: lab-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
