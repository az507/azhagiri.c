apiVersion: apps/v1
kind: Deployment
metadata:
  name: update-app
  labels:
    part-of: agile-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: update-app
  template:
    metadata:
      labels:
        app: update-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            - containerPort: 80
