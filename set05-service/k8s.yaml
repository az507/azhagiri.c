apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc-app
  labels:
    part-of: agile-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-svc-app
  template:
    metadata:
      labels:
        app: web-svc-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  labels:
    part-of: agile-lab
spec:
  type: NodePort
  selector:
    app: web-svc-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
