apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-app
  labels:
    part-of: agile-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: trouble-app
  template:
    metadata:
      labels:
        app: trouble-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            - containerPort: 80
