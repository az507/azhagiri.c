apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    part-of: agile-lab
data:
  APP_MESSAGE: "Hello from a Kubernetes ConfigMap"
  index.html: |
    <html><body><h1>Hello from a Kubernetes ConfigMap</h1></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-app
  labels:
    part-of: agile-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-app
  template:
    metadata:
      labels:
        app: config-app
    spec:
      volumes:
        - name: html
          configMap:
            name: app-config
            items:
              - key: index.html
                path: index.html
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: config-svc
  labels:
    part-of: agile-lab
spec:
  type: NodePort
  selector:
    app: config-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
