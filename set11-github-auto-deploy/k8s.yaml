apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-web-content
  labels:
    part-of: agile-lab
data:
  index.html: |
    <html><body><h1>Auto deploy demo - Version 1</h1></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-web
  labels:
    part-of: agile-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-web
  template:
    metadata:
      labels:
        app: auto-web
    spec:
      volumes:
        - name: html
          configMap:
            name: auto-web-content
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: auto-web-svc
  labels:
    part-of: agile-lab
spec:
  type: NodePort
  selector:
    app: auto-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
